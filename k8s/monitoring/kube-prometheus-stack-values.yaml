# Values for the kube-prometheus-stack Helm chart, tuned for a single-node
# minikube used for learning. Install / upgrade (see docs/observability.md):
#
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f k8s/monitoring/kube-prometheus-stack-values.yaml
#
# What the stack contains:
#   - Prometheus Operator: watches ServiceMonitor objects and turns them into
#     Prometheus scrape config (our chart ships one: charts/members-service).
#   - Prometheus: pulls (scrapes) /metrics endpoints and stores time series.
#   - Grafana: dashboards on top of Prometheus (preconfigured as a data source).
#   - Alertmanager: routes alerts. Installed but not used yet.
#   - node-exporter + kube-state-metrics: node and Kubernetes-object metrics,
#     which power the built-in "Kubernetes / Compute Resources" dashboards.

grafana:
  # Reachable at http://grafana.cms.local through Traefik, like cms.local.
  # Needs the /etc/hosts entry and `minikube tunnel` (docs/k8s-local-dev.md §3).
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.cms.local
    path: /
  # The dashboard sidecar loads any ConfigMap labelled grafana_dashboard: "1"
  # as a dashboard (on by default; stated here so it's visible). That is how
  # k8s/monitoring/service-red-dashboard.yaml gets into Grafana.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  # Loki as a second data source, next to the Prometheus one the chart adds.
  # A fixed uid lets dashboards point at it by name (service-red-dashboard.yaml
  # uses "uid": "loki"). The URL is Loki's Service inside the cluster
  # (k8s/monitoring/loki-values.yaml), so the browser never talks to Loki directly:
  # Grafana queries it on the browser's behalf.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      jsonData:
        # Loki returns at most this many lines per query (Grafana's default is 1000).
        maxLines: 1000
  # 256Mi was too tight: after ~2 weeks of uptime Grafana sat at 255/256Mi, spent
  # its CPU on garbage collection, and failed its probes, so Traefik answered 503
  # (found during CMS-28; study-guide §9.9). 512Mi leaves room for log queries,
  # which Grafana holds in memory while it renders them.
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

prometheus:
  prometheusSpec:
    # Keep two days of data — plenty for experiments, small on disk.
    retention: 2d
    # Prometheus only scrapes ServiceMonitors labelled release=kube-prometheus-stack
    # (the chart default). Our chart sets that label; see
    # charts/members-service/templates/servicemonitor.yaml.
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

# minikube runs these control-plane components bound to localhost inside the
# node, so Prometheus can't reach them: their targets would show DOWN forever
# and fire alerts. Not scraping them is the usual minikube setting.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
