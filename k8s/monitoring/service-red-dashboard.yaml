# Grafana dashboard: Rate, Errors, Duration (the RED method) per service.
#
# How it gets into Grafana: kube-prometheus-stack runs a "sidecar" next to
# Grafana that watches for ConfigMaps labelled grafana_dashboard: "1" and loads
# the JSON inside them as dashboards. No clicking around in the UI, and the
# dashboard lives in git like everything else.
#
#   kubectl apply -f k8s/monitoring/service-red-dashboard.yaml
#
# The "Service" dropdown lists every `job` that reports HTTP metrics, so the
# Events service will appear here automatically once it has a ServiceMonitor.
# Each panel's description (hover the ⓘ in Grafana) explains its PromQL;
# docs/study-guide.md walks through the queries in detail.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-service-red-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cms-service-red.json: |
    {
      "uid": "cms-service-red",
      "title": "CMS \u2014 Service RED metrics",
      "tags": [
        "cms",
        "red"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "job",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(http_server_request_duration_count, job)",
              "refId": "job"
            },
            "definition": "label_values(http_server_request_duration_count, job)",
            "refresh": 2,
            "current": {
              "text": "members-service",
              "value": "members-service"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods scraped (up)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "How many Pods Prometheus is successfully scraping for this job. 0 means the ServiceMonitor or the /metrics port is broken.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(up{job=\"$job\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Total request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "All API requests per second across every Pod.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum(rate(http_server_request_duration_count{job=\"$job\"}[$__rate_interval]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx error ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of requests that failed on the server side.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "(sum(rate(http_server_request_duration_count{job=\"$job\",http_response_status_code=~\"5..\"}[$__rate_interval])) or vector(0)) / sum(rate(http_server_request_duration_count{job=\"$job\"}[$__rate_interval]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "95% of requests finished faster than this.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{job=\"$job\"}[$__rate_interval])))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Rate \u2014 requests per second, by route",
          "description": "R of RED. rate() turns the ever-growing _count counter into per-second throughput; sum by (http_route) adds up all Pods per route.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (http_route) (rate(http_server_request_duration_count{job=\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{http_route}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Errors \u2014 failed requests per second, by status",
          "description": "E of RED. 5xx = our bug, 4xx = the client's mistake (validation, not found). Both are shown so you can tell them apart.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (http_response_status_code) (rate(http_server_request_duration_count{job=\"$job\",http_response_status_code=~\"[45]..\"}[$__rate_interval]))",
              "legendFormat": "{{http_response_status_code}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Duration \u2014 p50 / p95 / p99 latency",
          "description": "D of RED. histogram_quantile estimates percentiles from the histogram buckets. p95 = 95% of requests were faster than this line.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_server_request_duration_bucket{job=\"$job\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{job=\"$job\"}[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_bucket{job=\"$job\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Duration \u2014 p95 latency, by route",
          "description": "Same p95, split per route, to find which endpoint is slow.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_bucket{job=\"$job\"}[$__rate_interval])))",
              "legendFormat": "{{http_route}}"
            }
          ]
        }
      ]
    }
