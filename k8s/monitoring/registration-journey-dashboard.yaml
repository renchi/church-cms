          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "NATS: consumer lag and redeliveries",
          "description": "From the NATS exporter (k8s/nats-values.yaml). num_pending = messages in the stream not yet sent to that durable consumer: its LAG. It rises when the consuming service is down (EventDeliveryStalled fires after 2 minutes) and drains when it's back. Redelivered = sent more than once (a retry).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 39,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (consumer_name, stream_name) (nats_consumer_num_pending)",
              "legendFormat": "lag: {{consumer_name}} ← {{stream_name}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (consumer_name) (nats_consumer_num_redelivered)",
              "legendFormat": "redelivered: {{consumer_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Messages consumed, by outcome",
          "description": "messages_consumed_total{subject, outcome} from both services' consumers (@cms/events consumer.ts). applied = changed something; duplicate = seen before (idempotency at work); member-not-found = attendance for an unknown member; rejected = can never be processed; retried = failed this time, NATS redelivers later.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 47,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (job, subject, outcome) (rate(messages_consumed_total[$__rate_interval])) * 60",
              "legendFormat": "{{job}} {{subject}}: {{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
