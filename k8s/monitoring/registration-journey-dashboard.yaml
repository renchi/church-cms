          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Reconciliation: registrations vs MemberRegistered events",
          "description": "Two sources that should agree, over the selected range. 'registered (metric)' is members-service's in-memory counter: observability, approximate, reset on restart. 'MemberRegistered saved (outbox table)' is the durable record: a row written in the SAME transaction as the member, so it exists if and only if the member does. 'published to NATS' and 'still waiting' split those rows. If metric and table disagree, trust the table: the outbox, not a metric or a log line, is the proof that something happened (study guide §15).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 47,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(members_registered_total[$__range]))",
              "legendFormat": "registered (metric)",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (state) (outbox_rows{job=\"members-service\", subject=\"cms.members.registered\"})) - sum(max by (state) (outbox_rows{job=\"members-service\", subject=\"cms.members.registered\"} offset $__range))",
              "legendFormat": "MemberRegistered saved (outbox table)",
              "instant": true,
              "range": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(outbox_published_total{subject=\"cms.members.registered\"}[$__range]))",
              "legendFormat": "published to NATS",
              "instant": true,
              "range": false
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(outbox_rows{job=\"members-service\", subject=\"cms.members.registered\", state=\"pending\"}) or vector(0)",
              "legendFormat": "still waiting now",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
