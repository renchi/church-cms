            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Outbox: rows waiting, and the oldest one's age",
          "description": "From the outbox TABLE on each scrape (durable, @cms/events metrics.ts). Every Pod reports the same table, so max(), never sum(). Waiting rows and a growing age = the relay can't publish (NATS down?). Normally 0 and ~0 s.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 39,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (job, subject) (outbox_rows{state=\"pending\"})",
              "legendFormat": "{{job}} pending: {{subject}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (job) (outbox_oldest_pending_age)",
              "legendFormat": "{{job}} oldest age (s)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*oldest age.*"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Outbox publish delay p99",
          "description": "How long events waited between being saved and being published (outbox_publish_delay). The event SLO: 99% of MemberRegistered under 30 s. About 1 s normally (the relay polls every second).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 39,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le, subject) (rate(outbox_publish_delay_bucket[$__rate_interval])))",
              "legendFormat": "{{subject}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
