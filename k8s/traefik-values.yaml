# Values for the Traefik Helm chart (the Ingress controller). Install / upgrade:
#
#   helm upgrade --install traefik traefik/traefik --version 41.6.1 \
#     -n traefik --create-namespace -f k8s/traefik-values.yaml
#
# These were originally passed as --set flags (docs/k8s-local-dev.md §2). A values
# file is easier to read, can carry comments, and makes re-installs identical.

ports:
  traefik:
    expose:
      # Expose Traefik's own API/dashboard port (8080) on the Service, so the
      # Ingress in k8s/traefik-dashboard-ingress.yaml can route
      # http://traefik.cms.local/dashboard/ to it.
      default: true

ingressRoute:
  dashboard:
    # Don't let the chart create its own IngressRoute (a Traefik-specific CRD)
    # for the dashboard; we route to it with a standard Kubernetes Ingress instead.
    enabled: false

api:
  # Serve the dashboard without authentication. Fine for a local learning
  # cluster, never for anything reachable from a network.
  insecure: true

accessLog:
  # Access logs: one line per request that passes through Traefik (CMS-28).
  # Traefik is the only component that sees the *browser's* requests as they
  # arrive, e.g. the GET /members?registered=<id> that follows a registration,
  # so these lines are the client-side hop in Loki (study-guide §9.9).
  enabled: true
  # JSON, so `| json` in LogQL turns RequestPath, DownstreamStatus, Duration, ...
  # into fields, the same way it does for the services' pino lines.
  format: json
  fields:
    headers:
      # Leave request headers out of the log: they can carry cookies and
      # auth tokens, which must never land in a log store. (The chart's
      # default already; stated so it's visible.)
      defaultMode: drop
    queryParameters:
      # Keep the query string in RequestPath. Ours carries only ids
      # (?registered=<memberId>), which is how a registration's redirect is
      # found in Loki. An app that put tokens or emails in URLs would need
      # `drop` here.
      defaultMode: keep
