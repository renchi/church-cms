apiVersion: v1
kind: Service
metadata:
  # <release>-members-service. The web chart's config.membersApiUrl hardcodes this
  # name (http://members-service-members-service:3001): rename the release and that
  # value has to change too.
  name: {{ include "members-service.fullname" . }}
  labels:
    {{- include "members-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}    # ClusterIP
  selector:
    {{- include "members-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}        # port the Service exposes (3001)
      targetPort: http                         # references the container port named "http" above
    # Prometheus scrapes this port; the ServiceMonitor refers to it by name.
    - name: metrics
      protocol: TCP
      port: {{ .Values.metrics.port }}
      targetPort: metrics
