apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "members-service.fullname" . }}
  labels:
    {{- include "members-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "members-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "members-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.migrations.enabled }}
      # Init containers run to completion BEFORE the app container starts. If this
      # one fails, the Pod never becomes Ready, so a deploy with a broken migration
      # stops here instead of serving traffic against the wrong schema.
      #
      # Why not a Helm pre-install hook Job? The DB Secret is created by this same
      # chart, and a pre-install hook runs before the Secret exists.
      #
      # Every replica runs this, which is safe: "migrate deploy" takes a Postgres
      # advisory lock and is a no-op when nothing is pending.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # .bin/prisma is a pnpm shell shim, so it is run as a command (through
          # the image's tini ENTRYPOINT), not passed to node.
          args: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
      {{- end }}
      containers:
        - name: members-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "members-service.fullname" . }}-config

          # DB URL from Secret (injected as a single env var)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}

          # Liveness probe: if this fails N times, Kubernetes RESTARTS the container
          # Use this for "the app is deadlocked / permanently broken"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10   # wait 10s before first check (app boot time)
            periodSeconds: 15         # check every 15s
            failureThreshold: 3       # restart after 3 consecutive failures

          # Readiness probe: if this fails, Kubernetes REMOVES the Pod from the
          # Service's endpoint list (stops sending traffic) but does NOT restart it
          # Use this for "the app is temporarily overloaded / not ready yet"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

