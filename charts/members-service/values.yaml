replicaCount: 2

image:
  repository: members-service
  tag: local
  pullPolicy: Never   # Never = use local image; IfNotPresent = pull if not cached; Always = always pull

service:
  type: ClusterIP
  port: 3001

resources:
  requests:
    cpu: 100m      # 100 millicores = 0.1 CPU
    memory: 128Mi
  limits:
    cpu: 500m      # 500 millicores = 0.5 CPU
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

config:
  nodeEnv: production
  port: "3001"

# The actual DB URL goes in secret.yaml; this key just names the secret
database:
  secretName: members-service-db-secret
  secretKey: DATABASE_URL

ingress:
  enabled: false    # flip to true at deploy time: --set ingress.enabled=true
  host: cms.local
  path: /api/members

