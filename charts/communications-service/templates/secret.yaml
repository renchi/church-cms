apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "communications-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.database.secretKey }}: {{ "postgresql://cms_user:cms_password@communications-postgres:5432/communications_db" | b64enc | quote }}

