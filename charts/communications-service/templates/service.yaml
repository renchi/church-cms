apiVersion: v1
kind: Service
metadata:
  name: {{ include "communications-service.fullname" . }}
  labels:
    {{- include "communications-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}    # ClusterIP
  selector:
    {{- include "communications-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}        # port the Service exposes (3003)
      targetPort: http                         # references the container port named "http" above
    # Prometheus scrapes this port; the ServiceMonitor refers to it by name.
    - name: metrics
      protocol: TCP
      port: {{ .Values.metrics.port }}
      targetPort: metrics
