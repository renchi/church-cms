apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: {{ .Release.Name }}-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
        # The standard name label, which the services' charts already set. Alloy
        # turns it into the `app` log label, so web's logs are {app="web"} in Loki,
        # like {app="members-service"} (k8s/monitoring/alloy-values.yaml).
        # Only on the Pod template, not in spec.selector above: a Deployment's
        # selector can't be changed after creation, and adding a label to the
        # Pods doesn't need it to be.
        app.kubernetes.io/name: web
    spec:
      {{- /* The defaults repeat values.yaml on purpose. `helm upgrade --reuse-values`
      on a release made before CMS-32 does NOT get the chart's new defaults (Helm 4),
      so `shutdown` would be missing: a nil-pointer error, or an empty grace period. */}}
      {{- $shutdown := .Values.shutdown | default dict }}
      {{- $preStop := int (dig "preStopSeconds" 5 $shutdown) }}
      {{- $grace := int (dig "terminationGracePeriodSeconds" 30 $shutdown) }}
      {{- /* Fail the render, not the rollout: a grace period the sleep uses up leaves
      the app no time to shut down before SIGKILL (NATS drain cut off mid-message). */}}
      {{- if le $grace $preStop }}
      {{- fail (printf "shutdown.terminationGracePeriodSeconds (%d) must be longer than shutdown.preStopSeconds (%d): it also has to cover the app's own shutdown" $grace $preStop) }}
      {{- end }}
      # How long Kubernetes waits, from the moment it starts stopping the Pod,
      # before it SIGKILLs it. Covers the preStop sleep below plus the app's own
      # shutdown, so it must be longer than shutdown.preStopSeconds (values.yaml).
      terminationGracePeriodSeconds: {{ $grace }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if gt $preStop 0 }}
          # Zero-downtime rollouts (CMS-32, study guide §7.8). Stopping a Pod does two
          # things AT THE SAME TIME: it removes the Pod from the Service's endpoints,
          # and it runs this hook. Only when the hook returns does the app get SIGTERM.
          # Traefik needs a moment to see the endpoint change, so without the sleep
          # the app exits while Traefik still sends it requests (502s). With it, the
          # old Pod keeps serving until Traefik has moved on.
          # `sleep:` is Kubernetes' built-in sleep action: no `sleep` binary needed
          # in the image, unlike `exec: {command: [sleep, "5"]}`.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $preStop }}
          {{- end }}
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            # No PORT or HOSTNAME here: the standalone server's listen address
            # (0.0.0.0:3000) is set once, by the image's ENV (apps/web/Dockerfile),
            # and matches the containerPort, probes and Service targetPort (3000).
            # Without this the app falls back to localhost:3001 and /members shows
            # "Could not load members" (the bug fixed in CMS-26).
            - name: MEMBERS_API_URL
              value: {{ .Values.config.membersApiUrl | quote }}
            # Read by apps/web/lib/log.ts: lines below this level aren't written.
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | default "info" | quote }}
            # Tracing (values.yaml `tracing`). apps/web/instrumentation.ts registers
            # OpenTelemetry only when this is "otlp"; @vercel/otel then reads the endpoint.
            - name: OTEL_TRACES_EXPORTER
              value: {{ if .Values.tracing.otlpEndpoint }}"otlp"{{ else }}"none"{{ end }}
            {{- with .Values.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
