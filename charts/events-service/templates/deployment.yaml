apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "events-service.fullname" . }}
  labels:
    {{- include "events-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "events-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Kubernetes only replaces Pods when this Pod template changes, and a
      # changed ConfigMap isn't part of it: running Pods would keep the old
      # environment (e.g. no NATS_URL) until something else restarted them.
      # Hashing the rendered ConfigMap into an annotation fixes that: new
      # config → new hash → new template → a rolling update.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "events-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- /* The defaults repeat values.yaml on purpose. `helm upgrade --reuse-values`
      on a release made before CMS-32 does NOT get the chart's new defaults (Helm 4),
      so `shutdown` would be missing: a nil-pointer error, or an empty grace period. */}}
      {{- $shutdown := .Values.shutdown | default dict }}
      {{- $preStop := int (dig "preStopSeconds" 5 $shutdown) }}
      {{- $grace := int (dig "terminationGracePeriodSeconds" 30 $shutdown) }}
      {{- /* Fail the render, not the rollout: a grace period the sleep uses up leaves
      the app no time to shut down before SIGKILL (NATS drain cut off mid-message). */}}
      {{- if le $grace $preStop }}
      {{- fail (printf "shutdown.terminationGracePeriodSeconds (%d) must be longer than shutdown.preStopSeconds (%d): it also has to cover the app's own shutdown" $grace $preStop) }}
      {{- end }}
      # How long Kubernetes waits, from the moment it starts stopping the Pod,
      # before it SIGKILLs it. Covers the preStop sleep plus the app's own
      # shutdown (src/index.ts: finish the current NATS message, drain the
      # connection), so it must be longer than shutdown.preStopSeconds.
      terminationGracePeriodSeconds: {{ $grace }}
      {{- if .Values.migrations.enabled }}
      # Init containers run to completion BEFORE the app container starts. If this
      # one fails, the Pod never becomes Ready, so a deploy with a broken migration
      # stops here instead of serving traffic against the wrong schema.
      #
      # Why not a Helm pre-install hook Job? The DB Secret is created by this same
      # chart, and a pre-install hook runs before the Secret exists.
      #
      # Every replica runs this, which is safe: "migrate deploy" takes a Postgres
      # advisory lock and is a no-op when nothing is pending.
      #
      # Caveat: migrations are forward-only. If the new Pods then fail readiness,
      # "helm --rollback-on-failure" rolls back the IMAGE but NOT the schema, so every
      # migration must stay compatible with the previous release (expand/contract:
      # add first, drop in a later release). See docs/ci-cd.md.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # .bin/prisma is a pnpm shell shim, so it is run as a command (through
          # the image's tini ENTRYPOINT), not passed to node.
          args: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
      {{- end }}
      containers:
        - name: events-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if gt $preStop 0 }}
          # Zero-downtime rollouts (CMS-32, study guide §7.8): same as charts/web.
          # Removing the Pod from the endpoints and running this hook happen at the
          # same time, and SIGTERM comes only after the hook. Without the sleep,
          # Fastify starts closing while Traefik still routes to this Pod, so some
          # requests fail even with a second replica. Built-in sleep: no binary needed.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $preStop }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
            # Prometheus metrics, served by the OpenTelemetry SDK
            # (src/instrumentation.ts). A separate port keeps /metrics off the
            # public Ingress, which only routes to "http".
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "events-service.fullname" . }}-config

          # DB URL from Secret (injected as a single env var)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}

          # Liveness probe: if this fails N times, Kubernetes RESTARTS the container
          # Use this for "the app is deadlocked / permanently broken"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10   # wait 10s before first check (app boot time)
            periodSeconds: 15         # check every 15s
            failureThreshold: 3       # restart after 3 consecutive failures

          # Readiness probe: if this fails, Kubernetes REMOVES the Pod from the
          # Service's endpoint list (stops sending traffic) but does NOT restart it
          # Use this for "the app is temporarily overloaded / not ready yet"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

