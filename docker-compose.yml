# docker-compose.yml — local multi-service development stack
#
# Quick reference:
#   docker compose up --build      start everything (rebuilds service images)
#   docker compose up              start without rebuilding (faster after first run)
#   docker compose down            stop and remove containers (data volume survives)
#   docker compose down -v         stop and remove containers AND the DB volume
#   docker compose logs -f members-service   tail a single service's logs
#
# On startup the order is: members-db → members-migrate (applies the schema, then
# exits) → members-service → web. So a fresh "docker compose up" gives you a
# working, migrated database and a running frontend with no manual steps.
# events-service follows the same chain with its OWN database (events-db →
# events-migrate → events-service): one Postgres per service, ADR-0008.
#
# ── Production-shaped vs. dev hot-reload ─────────────────────────────────────
# This file is production-shaped: the web service runs "next build + next start"
# in a slim runner image.  But docker-compose.override.yml IS committed alongside
# it, and Docker Compose automatically merges any docker-compose.override.yml in
# the same directory — so the DEFAULT "docker compose up" runs the dev override
# (hot-reload via "next dev"), not the production image.
# To run the production-shaped stack instead, opt out of the override explicitly:
#   docker compose -f docker-compose.yml up --build
#
# Credentials are read from .env in this directory (see .env.example).
# Docker Compose automatically loads .env for ${VAR} substitution in this file.
# Do NOT commit .env — it is git-ignored.

# ─── Reusable config (YAML anchor) ───────────────────────────────────────────
# Keys starting with "x-" are extension fields: Docker Compose ignores them as
# services, but we can reference them as anchors to avoid repeating ourselves.
# "&members-base" names this block; "<<: *members-base" below merges it into a
# service. Both the migrate job and the long-running service are built from the
# same image and need the same DATABASE_URL, so we define those once here.
x-members-base: &members-base
  build:
    # "context: ." means the build context is the monorepo root.
    # The Dockerfile needs the root pnpm-lock.yaml and workspace config,
    # so we must build from here, not from apps/members-service/.
    context: .
    dockerfile: apps/members-service/Dockerfile
    # host network for build steps — Docker's bridge DNS cannot reach npm or
    # Alpine CDN on this machine; host network bypasses that for RUN steps.
    network: host
  # Pin an explicit image name so both services share ONE built image instead
  # of each building their own. Compose builds it once and reuses it.
  image: church-cms-members-service:latest
  environment:
    # Inside Docker, services talk to each other by service name, not "localhost".
    # "members-db" is the service name defined below — Docker's internal DNS
    # resolves it to that container's IP automatically. This is why DATABASE_URL
    # here differs from apps/members-service/.env (which uses localhost for
    # running the service directly on your machine, outside Docker).
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@members-db:5432/${POSTGRES_DB}
  networks:
    - cms-network

# The same pattern for events-service (CMS-18). Its database is a separate
# container, so its DATABASE_URL points at "events-db", not "members-db".
x-events-base: &events-base
  build:
    context: .
    dockerfile: apps/events-service/Dockerfile
    network: host
  image: church-cms-events-service:latest
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@events-db:5432/events_db
  networks:
    - cms-network

services:

  # ─── Database ──────────────────────────────────────────────────────────────
  members-db:
    image: postgres:16-alpine

    # env_file passes the variables from .env directly into the container's
    # environment. The postgres image reads POSTGRES_USER, POSTGRES_PASSWORD,
    # and POSTGRES_DB on first start to create the database and the superuser.
    env_file: .env

    ports:
      # host-port:container-port — exposes Postgres on your machine so you can
      # connect with psql or a GUI tool (e.g. TablePlus) at localhost:5432.
      - "5432:5432"

    volumes:
      # Named volume: Docker manages the storage location on your host.
      # Data persists across "docker compose down" restarts (but not "down -v").
      - members-db-data:/var/lib/postgresql/data

    networks:
      - cms-network

    healthcheck:
      # pg_isready probes whether Postgres is accepting connections.
      # "$$" escapes to a literal "$" so Docker Compose doesn't try to interpolate
      # $POSTGRES_USER as a Compose variable — the shell inside the container
      # expands it instead, reading the value we injected via env_file above.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s      # check every 10 seconds
      timeout: 5s        # fail the check if it takes longer than 5 seconds
      retries: 5         # mark unhealthy after 5 consecutive failures
      start_period: 10s  # don't count failures during the first 10 s (DB is initialising)

  # ─── Migration job — applies the schema, then exits ─────────────────────────
  members-migrate:
    # Merge in the shared build/image/DATABASE_URL/network config defined above.
    <<: *members-base

    # Override the image's default command (node dist/index.js) to run the Prisma
    # migrator instead. "migrate deploy" applies any pending migrations from
    # prisma/migrations and is the production-safe command (unlike "migrate dev",
    # it never generates new migrations or prompts). The image's ENTRYPOINT (tini)
    # still runs, so this becomes: tini -- node_modules/.bin/prisma migrate deploy.
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]

    # This is a one-shot job: it runs once and exits. Don't restart it.
    restart: "no"

    depends_on:
      members-db:
        # Wait until Postgres is actually accepting connections (healthcheck
        # above) before trying to apply migrations.
        condition: service_healthy

    # Note: this "run migrations as a separate job, then start the app" pattern
    # maps directly to a Kubernetes init container / Job (see CMS-14). The
    # long-running service image deliberately does NOT run migrations itself.

  # ─── Members service ────────────────────────────────────────────────────────
  members-service:
    # Same image and DATABASE_URL as the migrate job (via the anchor); the image's
    # default command (node dist/index.js) runs since we don't override it here.
    <<: *members-base

    ports:
      - "3001:3001"

    depends_on:
      members-migrate:
        # "service_completed_successfully" waits until the migrate job has run and
        # exited with code 0. This transitively also waits for members-db (which
        # the migrate job depends on), so the app only starts once the database
        # exists, is reachable, AND has the current schema applied.
        condition: service_completed_successfully

  # ─── Events: database, migration job, service ──────────────────────────────
  # A second, independent Postgres. Nothing in members-db is visible from here
  # and vice versa; the two services share data only by id (memberId).
  events-db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      # Overrides POSTGRES_DB from .env (members_db) for this container only.
      POSTGRES_DB: events_db
    ports:
      # 5433 on the host, because members-db already has 5432. Inside the
      # Docker network both listen on 5432; only the host-side port differs.
      - "5433:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  events-migrate:
    <<: *events-base
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      events-db:
        condition: service_healthy

  events-service:
    <<: *events-base
    ports:
      - "3002:3002"
    depends_on:
      events-migrate:
        condition: service_completed_successfully

  # ─── Web frontend ───────────────────────────────────────────────────────────
  web:
    build:
      # Build from the monorepo root — the Dockerfile needs the root
      # pnpm-lock.yaml and workspace config to install dependencies correctly.
      context: .
      dockerfile: apps/web/Dockerfile
      # "network: host" passes the host machine's network stack to each RUN step
      # during "docker build".  Normally Docker uses an isolated bridge network
      # for build steps; on this machine the bridge's DNS cannot resolve external
      # registries (npm, Alpine CDN), so pnpm install fails.  host network mode
      # bypasses that — build-time RUN steps use the host's DNS and routes.
      # NOTE: this setting only affects the BUILD, not the running container.
      network: host
    # Pin a name so the image can be referenced in other contexts (e.g. a
    # Kubernetes manifest that pulls from a local registry during minikube work).
    image: church-cms-web:latest

    ports:
      # host-port:container-port — the frontend is available at localhost:3000.
      - "3000:3000"

    environment:
      # NEXT_PUBLIC_MEMBERS_API_URL is read by the members page at request time.
      # Inside Docker, services reach each other by service name — Docker's
      # internal DNS resolves "members-service" to the right container IP.
      # This URL is only valid server-side (inside the Docker network); browser
      # requests go to localhost:3001 via the exposed port, not this address.
      NEXT_PUBLIC_MEMBERS_API_URL: http://members-service:3001

    # "init: true" tells Docker to inject its own tini binary (/usr/bin/docker-init)
    # as PID 1 in this container.  This gives us signal forwarding and zombie
    # reaping without needing "apk add tini" in the Dockerfile.  The members-service
    # installs tini directly in its image (either approach is valid — see the
    # Dockerfile for a full explanation of the trade-offs).
    init: true

    networks:
      - cms-network

    depends_on:
      members-service:
        # Wait until members-service reports healthy (its Dockerfile defines a
        # HEALTHCHECK that probes /health), not merely "started". This matches
        # the readiness-gating used elsewhere in this file (members-db uses
        # service_healthy, members-migrate uses service_completed_successfully)
        # and avoids the frontend's first /members request landing on the error
        # state before the API is actually serving. The page still degrades
        # gracefully if the API drops later — this just removes the cold-start race.
        condition: service_healthy

  # ─── Adminer — lightweight DB browser ──────────────────────────────────────
  adminer:
    # Adminer is a single-file PHP web UI for browsing and querying any database.
    # Open http://localhost:8080 in your browser and log in with:
    #   System:   PostgreSQL
    #   Server:   members-db   (the service name — Docker DNS resolves it)
    #   Username: POSTGRES_USER     from .env
    #   Password: POSTGRES_PASSWORD from .env
    #   Database: POSTGRES_DB       from .env
    image: adminer

    ports:
      - "8080:8080"

    networks:
      - cms-network

    depends_on:
      - members-db

# ─── Shared infrastructure ─────────────────────────────────────────────────

volumes:
  # Top-level volume declaration — makes the name "members-db-data" available
  # across all services. Docker creates it on first run if it doesn't exist.
  members-db-data:
  events-db-data:

networks:
  # All services share this bridge network so they can reach each other by
  # service name (e.g. "members-db"). Without a shared network, containers
  # are isolated and cannot communicate.
  cms-network:
    driver: bridge
