#
# CI — runs on every pull request (and on main after merge).
#
# Three independent jobs run in parallel on GitHub-hosted runners. Their job
# names (lint-typecheck, unit-tests, integration-tests) are the "required status
# checks" in main's branch protection, so a red job blocks the merge.
#
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      # Full history, so check-docs.sh can compare the PR with origin/main and
      # fail on a line link whose target moved. A shallow clone has no main, and
      # would skip that check (and the warnings) without a word.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 9 matches the lockfile (and the Dockerfiles' corepack pin).
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      # cache: pnpm caches the pnpm store between runs, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Without a generated client, PrismaClient is typed as "any" and typecheck
      # would silently accept repository code that no longer matches the schema.
      # One per service. Each generates into its own folder (events-service sets
      # a custom `output`), so they don't overwrite each other.
      - run: pnpm --filter members-service exec prisma generate
      - run: pnpm --filter events-service exec prisma generate
      - run: pnpm lint
      # Broken doc links (missing files, line links past the end of a file) fail
      # the build like a lint error. The learning docs are a deliverable here.
      # With the full-history checkout above it also compares with origin/main:
      # a moved line link fails here, as it does locally.
      - run: scripts/check-docs.sh
      # Every env var an app reads must be set by its Helm chart. Catches the
      # CMS-26 bug class: compose sets a variable, the chart forgets it, and the
      # app silently falls back to a default that's wrong in the cluster.
      - run: scripts/check-env.sh
      - run: pnpm -r typecheck
      - run: pnpm build

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Convention: a package with a "test" script must also define "test:unit".
      # Without this check, the --if-present below would silently skip a package
      # whose tests have no test:unit alias, and this required check would pass.
      - name: Check every tested package defines test:unit
        run: |
          missing=0
          for pkg in apps/*/package.json packages/*/package.json; do
            [ -f "$pkg" ] || continue
            if jq -e '.scripts.test and (.scripts["test:unit"] | not)' "$pkg" > /dev/null; then
              echo "::error file=$pkg::has a \"test\" script but no \"test:unit\" script"
              missing=1
            fi
          done
          exit $missing
      # Unit tests only; the integration tests have their own job below.
      - run: pnpm -r --if-present test:unit

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full suite (unit + integration). GitHub's ubuntu runners have Docker,
      # so Testcontainers can start a real Postgres. test:coverage also enforces
      # the 70% thresholds in vitest.config.ts.
      - run: pnpm --filter members-service test:coverage
      - run: pnpm --filter events-service test:coverage
      # The shared @cms/events package: its integration test runs a real NATS
      # server in Docker (ADR-0010: dedupe, durable consumers, replay).
      - run: pnpm --filter @cms/events test
